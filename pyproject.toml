[project]
name = "virtual-tokyo"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "bpy",
  "usd-core",
  "pyproj",
  "shapely",
  "numpy",
  "requests",
  "matplotlib",
  "scipy>=1.17.1",
  "anny>=0.6.2",
]

[project.optional-dependencies]
terra = [
    "numba",
    "rasterio",
    "pyyaml",
    "pyproj",
    "scipy",
    "pillow",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vt", "src/terra"]

[project.scripts]
terra = "terra.cli:main"
