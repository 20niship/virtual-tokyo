[project]
name = "virtual-tokyo"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "bpy",
  "usd-core",
  "pyproj",
  "shapely",
  "numpy",
  "requests",
  "matplotlib",
  "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vt"]
